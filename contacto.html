    <main>
        <section class="seccion">
            <h1>Contacto</h1>
            <div class="contacto">
                <div class="datos">
                    <a href="https://maps.google.com/?q=Universidad+Tecnologica+Emiliano+Zapata" target="_blank"><img src="img/mapa.svg" alt="Mapa de ubicación de la UTEZ en Emiliano Zapata, Morelos"></a>
                    <h2>Mapa de ubicación</h2>
                    <p><strong>Dirección:</strong> Av. Universidad Tecnológica No. 1, Palo Escrito, Emiliano Zapata, Mor.</p>
                    <p><strong>Correo:</strong> <a href="mailto:pedrourieta@utez.edu.mx">pedrourieta@utez.edu.mx</a></p>
                    <p><strong>Teléfono:</strong> 777 123 4567</p>
                </div>
                <form class="formulario" action="#" method="post">
                    <h2>Envíame un mensaje</h2>
                    <label for="nombre"><img src="img/icono-usuario.svg" alt="Ícono de usuario"></label>
                    <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
                    <label for="correo"><img src="img/icono-correo.svg" alt="Ícono de correo electrónico"></label>
                    <input type="email" id="correo" name="correo" placeholder="Correo electrónico" required>
                    <label for="comentarios" class="etiqueta-texto">Comentarios</label>
                    <textarea id="comentarios" name="comentarios" rows="5"></textarea>
                    <button type="submit" class="boton-primario">Enviar</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="pie">
